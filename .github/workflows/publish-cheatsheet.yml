name: Publish cheatsheet

on:
  push:
    branches:
      - master
    paths:
      - docs/cheatsheet.md
      - docs/cheatsheet/**
      - scripts/build-cheatsheet.sh
      - .github/workflows/publish-cheatsheet.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-26.04

    steps:
      - uses: actions/checkout@v7

      - name: Install pandoc
        run: |
          sudo apt-get update
          sudo apt-get install --yes pandoc

      - name: Build single-page cheatsheet
        run: ./scripts/build-cheatsheet.sh

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: build/cheatsheet

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-26.04

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
