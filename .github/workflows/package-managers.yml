name: Package managers

on:
  push:
    paths:
      - CMakeLists.txt
      - cmake/**
      - conanfile.py
      - include/**
      - packaging/**
      - test_package/**
      - tests/cmake/**
      - .github/workflows/package-managers.yml
  pull_request:
    paths:
      - CMakeLists.txt
      - cmake/**
      - conanfile.py
      - include/**
      - packaging/**
      - test_package/**
      - tests/cmake/**
      - .github/workflows/package-managers.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: package-managers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  conan:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Install Conan
        run: python -m pip install --disable-pip-version-check conan

      - name: Create package
        env:
          CC: clang
          CXX: clang++
        run: |
          conan profile detect --force
          conan create . --build=missing -s compiler.cppstd=17

  vcpkg:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: Bootstrap vcpkg
        run: |
          git clone --depth 1 https://github.com/microsoft/vcpkg.git \
            "$RUNNER_TEMP/vcpkg"
          "$RUNNER_TEMP/vcpkg/bootstrap-vcpkg.sh" -disableMetrics

      - name: Install overlay port
        env:
          CC: clang
          CXX: clang++
        run: >-
          "$RUNNER_TEMP/vcpkg/vcpkg" install jplcz-microfmt
          --overlay-ports="$GITHUB_WORKSPACE/packaging/vcpkg/ports"
          --triplet x64-linux

      - name: Configure consumer
        run: >-
          cmake -S tests/cmake/find_package -B build/vcpkg -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_CXX_COMPILER=clang++
          -DCMAKE_TOOLCHAIN_FILE="$RUNNER_TEMP/vcpkg/scripts/buildsystems/vcpkg.cmake"

      - name: Build and run consumer
        run: |
          cmake --build build/vcpkg --parallel 2
          ./build/vcpkg/find_package_consumer

  cpm:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - name: Download CPM.cmake
        run: >-
          curl --fail --location --silent --show-error
          https://github.com/cpm-cmake/CPM.cmake/releases/download/v0.43.1/CPM.cmake
          --output "$RUNNER_TEMP/CPM.cmake"

      - name: Configure consumer
        run: >-
          cmake -S tests/cmake/cpm -B build/cpm -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_CXX_COMPILER=clang++
          -DCPM_CMAKE_PATH="$RUNNER_TEMP/CPM.cmake"
          -DJPLCZ_MICROFMT_SOURCE_DIR="$GITHUB_WORKSPACE"

      - name: Build and run consumer
        run: |
          cmake --build build/cpm --parallel 2
          ./build/cpm/cpm_consumer
