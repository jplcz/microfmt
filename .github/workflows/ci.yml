name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux GCC
            os: ubuntu-latest
            compiler: g++
          - name: Linux Clang
            os: ubuntu-latest
            compiler: clang++
          - name: macOS AppleClang
            os: macos-latest
            compiler: clang++
          - name: Windows MSVC
            os: windows-latest
            compiler: cl

    steps:
      - uses: actions/checkout@v7

      - name: Enable the MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build, test, and check public headers
        shell: bash
        run: >-
          ./scripts/run-native-ci.sh build Release
          -DCMAKE_CXX_COMPILER=${{ matrix.compiler }}
