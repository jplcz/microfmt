name: Cross-compile

on:
  push:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - converted_to_draft
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cross-compile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: x86_64
            target: x86_64-gcc
            packages: ccache
          - name: arm32
            target: arm32-gcc
            packages: ccache g++-arm-linux-gnueabihf
          - name: aarch64
            target: aarch64-gcc
            packages: ccache g++-aarch64-linux-gnu
          - name: riscv64
            target: riscv64-gcc
            packages: ccache g++-riscv64-linux-gnu

    steps:
      - uses: actions/checkout@v7

      - name: Install compiler support
        run: |
          sudo apt-get update
          sudo apt-get install --yes ${{ matrix.packages }}

      - name: Build matrix target
        env:
          JPLCZ_MICROFMT_BUILD_TARGETS: ${{ matrix.target }}
          JPLCZ_MICROFMT_BUILD_TYPES: Release
          JPLCZ_MICROFMT_MATRIX_BUILD_ROOT: ${{ github.workspace }}/build/matrix
        run: ./scripts/build-matrix.sh
